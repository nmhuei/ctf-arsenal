services:
  secret-storage:
    build: .
    ports:
      - "8080:8080"
    environment:
      SECRET_STORAGE_DB: /data/secrets.db
      BOOTSTRAP_ADMIN_PASSWORD: REDACTED
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - secret-storage-data:/data
    restart: unless-stopped

volumes:
  secret-storage-data:
