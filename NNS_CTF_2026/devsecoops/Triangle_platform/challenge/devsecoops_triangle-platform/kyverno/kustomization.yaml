apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - install.yaml

patches:
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kyverno-background-controller
        namespace: kyverno
      $patch: delete
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kyverno-cleanup-controller
        namespace: kyverno
      $patch: delete
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kyverno-reports-controller
        namespace: kyverno
      $patch: delete
