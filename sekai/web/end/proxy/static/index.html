<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ReadView</title>
  <link rel="stylesheet" href="https://cdn.simplecss.org/simple.css">
  <script src="/static/dompurify.min.js"></script>
  <script src="/static/preview.js"></script>
</head>
<body>
  <header>
    <h1>ReadView</h1>
    <p>A distraction-free reading proxy. All scripts are blocked automatically.</p>
  </header>
  <main>
    <h2>Pages</h2>
    <ul>
      {{PAGES}}
    </ul>
    <h2>Add Page</h2>
    <form action="/add" method="GET">
      <p><label>Name <input name="name" placeholder="lowercase alphanumeric, 4+ chars" required></label></p>
      <p><label>URL <input name="url" type="url" placeholder="https://example.com" required></label></p>
      <p><label>Description <textarea name="desc" rows="3" placeholder="Supports HTML formatting"></textarea></label></p>
      <div id="preview"><em>preview appears here</em></div>
      <p><button type="submit">Add</button></p>
    </form>
  </main>
</body>
</html>
