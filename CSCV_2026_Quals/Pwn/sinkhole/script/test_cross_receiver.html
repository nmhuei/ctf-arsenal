<!doctype html>
<meta charset="utf-8">
<script>
// The sink pass does not check that the transition and the first tagged
// element store have the same receiver.  At runtime all three parameters are
// aliased, while feedback keeps their element kinds distinct.
const lines = ["function trigger(x, trans, store, read, obj, idx, limit) {"];
for (let i = 0; i < 650; i++) lines.push(`if (x === ${i}) return ${i};`);
lines.push("trans[0] = 1.1;");
lines.push("store[0] = obj;");
lines.push("let i = 0, res = 0;");
lines.push("while (i < limit) {");
for (let i = 0; i < 430; i++) lines.push(`res = (res + ${i % 7}) | 0;`);
lines.push("res = read[idx] + 0.0;");
lines.push("Array.prototype.push.call(read, 4.950618252845e-311);");
lines.push("i++;");
lines.push("}");
lines.push("return res;");
lines.push("}");
lines.push("return trigger;");
const trigger = new Function(lines.join("\n"))();

function makeSmi() { return [1, 2, 3]; }
function makeDouble() { return [1.1, 2.2, 3.3]; }
function makeObject() { return [{ warm: 1 }, { warm: 2 }, { warm: 3 }]; }
const obj = { marker: 0x1337 };
for (let i = 0; i < 12000; i++) {
  trigger(1000, makeSmi(), makeObject(), makeDouble(), obj, 0, 1);
}

const victim = makeSmi();
let result;
try {
  result = trigger(1000, victim, victim, victim, obj, 0, 2);
  console.log("result", typeof result, result);
} catch (e) {
  console.log("caught", e && e.name, e && e.message);
}
for (let i = 0; i < 7; i++) {
  try { console.log("victim" + i, typeof victim[i], victim[i]); }
  catch (e) { console.log("victim" + i, "ERR", e && e.message); }
}
console.log("victim length", victim.length);
</script>
