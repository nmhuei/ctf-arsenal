<!DOCTYPE html><html><body><script>
function create_fn() {
  let lines = [];
  lines.push("function step3_store(x, arr, obj) {");
  for (let i = 0; i < 650; i++) lines.push(`  if (x === ${i}) return ${i};`);
  lines.push(`arr[0] = obj; return arr[1];`);
  lines.push("}");
  lines.push("return step3_store;");
  let fn = new Function(lines.join("\n"))();
  return fn;
}

let dummy = { a: 1 };
let stable = [dummy, 2.2, 3.3];
let farr = [1.1, 2.2, 3.3];

async function run() {
  let fn = create_fn();
  for (let i = 0; i < 20000; i++) {
    fn(i, stable, dummy);
  }
  await new Promise(r => setTimeout(r, 500));
  console.log("Done step3_store");
}
run();
</script></body></html>
