<!DOCTYPE html><html><body><script>
async function main() {
  let lines = [];
  lines.push("function test_sce(x, arr, idx) {");
  for (let i = 0; i < 650; i++) lines.push(`  if (x === ${i}) return ${i};`);
  lines.push("  return arr[idx];");
  lines.push("}");
  lines.push("return test_sce;");

  let fn = new Function(lines.join("\n"))();
  let arr = [];
  for (let i = 0; i < 50000; i++) arr.push(1.1 * (i + 1));

  console.log("Warmup starting...");
  for (let i = 0; i < 1500; i++) {
    fn(1000, arr, 10);
  }
  console.log("Warmup done!");
  await new Promise(r => setTimeout(r, 2000));

  // Now test with an object!
  let obj = { a: 1 };
  let res = fn(1000, arr, obj);
  console.log("RES:", typeof res, res);
  let buf = new ArrayBuffer(8);
  let f64 = new Float64Array(buf);
  let u32 = new Uint32Array(buf);
  f64[0] = res;
  console.log("HEX: 0x" + u32[1].toString(16) + u32[0].toString(16));
}
main();
</script></body></html>
