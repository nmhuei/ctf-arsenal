<!doctype html>
<meta charset="utf-8">
<script>
const idxObj = { marker: 0x1337 };
const lines = ["function trigger(x, arr, idx, limit) {"];
for (let i = 0; i < 650; i++) lines.push(`if (x === ${i}) return ${i};`);
lines.push("let i = 0, result = 0;");
lines.push("while (i < limit) {");
for (let i = 0; i < 430; i++) lines.push(`result = (result + ${i % 7}) | 0;`);
lines.push("result = arr[idx];");
lines.push("i++;");
lines.push("}");
lines.push("return result;");
lines.push("}");
lines.push("return trigger;");
const trigger = new Function(lines.join("\n"))();
const arr = [7];
arr.length = 10_000_000;
for (let i = 0; i < 15000; i++) trigger(1000, arr, 0, 1);
try {
  const result = trigger(1000, arr, idxObj, 1);
  console.log("result", typeof result, result, "length", arr.length);
} catch (e) { console.log("caught", e && e.name, String(e)); }
</script>
