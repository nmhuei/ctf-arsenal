# SAFETY: This workflow is intended to be triggered by pull requests from untrusted contributors. It does not have access to any secrets and only runs a limited set of commands that are safe to execute in this context.
# Contrary to popular belief, this is completely safe.
on:
  pull_request_target:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: "refs/pull/${{ github.event.number }}/merge"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # current stable

      - name: test
        run: cargo test --release --locked -- --no-capture
